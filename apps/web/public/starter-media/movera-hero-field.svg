<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MOVERA mobility intelligence field</title>
  <desc id="desc">An abstract route network in MOVERA blue.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFE"/>
      <stop offset="1" stop-color="#E6F2F8"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2352A4" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#2D90CF"/>
      <stop offset="1" stop-color="#2352A4" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2352A4" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1110" cy="370" rx="330" ry="230" fill="#2D90CF" fill-opacity=".12" filter="url(#soft)"/>
  <path d="M-30 620C200 520 260 720 490 584S760 220 990 330s344 350 660 98" fill="none" stroke="url(#route)" stroke-width="4"/>
  <path d="M-30 700C212 590 316 790 532 640S754 364 972 432s372 264 660 120" fill="none" stroke="#2352A4" stroke-opacity=".15" stroke-width="2"/>
  <path d="M260 120C432 210 430 392 610 444s286-88 420-24 170 264 370 270" fill="none" stroke="#2D90CF" stroke-opacity=".24" stroke-width="2" stroke-dasharray="12 14"/>
  <g fill="#2D90CF">
    <circle cx="260" cy="620" r="9"/><circle cx="490" cy="584" r="9"/><circle cx="990" cy="330" r="9"/><circle cx="1325" cy="445" r="9"/>
  </g>
  <g fill="#2352A4" fill-opacity=".6">
    <rect x="222" y="208" width="18" height="18" rx="4"/><rect x="1320" y="172" width="27" height="27" rx="6"/><rect x="1440" y="650" width="16" height="16" rx="4"/>
  </g>
</svg>
